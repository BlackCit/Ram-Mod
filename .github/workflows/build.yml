name: Build RAM Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Mindustry v8 jar
        run: |
          URL=$(curl -sL https://github.com | grep -oE '"browser_download_url": "[^"]+Mindustry\.jar"' | head -n 1 | cut -d '"' -f 4)
          echo "Downloading: $URL"
          curl -sL "$URL" -o Mindustry.jar

      - name: Compile Java & Build Android DEX
        run: |
          mkdir -p build sprites sprites-override
          javac --release 8 -cp Mindustry.jar -d build $(find src -name "*.java")
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" | sort -V | tail -n 1)
          "$D8" --min-api 21 --output . $(find build -name "*.class")
          cp -r build/ram .
          cp -r assets/bundles .
          cp -r assets/sprites/* sprites/
          cp -r assets/sprites/* sprites-override/
          jar cf RAM-Universal.jar mod.hjson icon.png classes.dex ram bundles sprites sprites-override

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAM-Universal
          path: RAM-Universal.jar

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RAM Hacker Edition v1.0.${{ github.run_number }}
          files: RAM-Universal.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RAM Hacker Edition v1.0.${{ github.run_number }}
          files: RAM-Universal.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
